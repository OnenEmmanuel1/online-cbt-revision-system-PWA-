version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: cbtr_mysql
    restart: always
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: ${DB_NAME:-cbtr_db}
      MYSQL_USER: ${DB_USER:-cbtr_user}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./seed.sql:/docker-entrypoint-initdb.d/2-seed.sql

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cbtr_api
    restart: always
    depends_on:
      - mysql
    environment:
      - DB_HOST=mysql
      - DB_USER=${DB_USER:-cbtr_user}
      - DB_PASSWORD=
      - DB_NAME=${DB_NAME:-cbtr_db}
      - JWT_SECRET=${JWT_SECRET:-supersecretkey}
      - PORT=5000
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: cbtr_client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  mysql_data:
